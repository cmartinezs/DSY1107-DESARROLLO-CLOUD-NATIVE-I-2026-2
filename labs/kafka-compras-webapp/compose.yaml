services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: dsy1107-kafka-s12
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 25s

  compras-api:
    profiles: ["app"]
    build: ./webapp/compras-api
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER:-PENDIENTE}
      APP_KAFKA_TOPIC: ${KAFKA_TOPIC:-PENDIENTE}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      kafka:
        condition: service_healthy

  resumen-api:
    profiles: ["app"]
    build: ./webapp/resumen-api
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER:-PENDIENTE}
      APP_KAFKA_TOPIC: ${KAFKA_TOPIC:-PENDIENTE}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${KAFKA_GROUP:-PENDIENTE}
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      kafka:
        condition: service_healthy

  web:
    profiles: ["app"]
    build: ./webapp/web
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      - compras-api
      - resumen-api

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: compras-webapp
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    depends_on:
      kafka:
        condition: service_healthy
