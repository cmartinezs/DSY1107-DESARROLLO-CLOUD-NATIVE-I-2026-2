server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ACTIVIDAD DEL ESTUDIANTE:
    # Cambia los nombres __SERVICIO_COMPRAS__ y __SERVICIO_RESUMEN__
    # por los nombres que aparecen en compose.yaml.
    location /api/compras {
        proxy_pass http://__SERVICIO_COMPRAS__:8080;
    }

    location /api/resumen {
        proxy_pass http://__SERVICIO_RESUMEN__:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
