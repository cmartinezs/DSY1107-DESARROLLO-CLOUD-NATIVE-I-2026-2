server:
  port: 8080

spring:
  application:
    name: dsy1107-api-gateway-lab
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - AddResponseHeader=X-Gateway-Lab, DSY1107
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - http://localhost:5500
                  - http://127.0.0.1:5500
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: '*'
                maxAge: 3600
          routes:
            - id: posts-v1
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/api/v1/posts/**
              filters:
                - StripPrefix=2
                - AddResponseHeader=X-API-Version, v1
            - id: posts-v2
              uri: https://jsonplaceholder.typicode.com
              predicates:
                - Path=/api/v2/posts/**
              filters:
                - StripPrefix=2
                - AddResponseHeader=X-API-Version, v2
